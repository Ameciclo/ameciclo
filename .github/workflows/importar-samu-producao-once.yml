name: Importar chamados do SAMU em produção (one-off)

# Descartável: carrega os chamados do SAMU (2018 a 2025) no banco de produção (packages/db/scripts/import-samu.ts).
# A tabela é um retrato do arquivo: rodar de novo a substitui. Rodar uma vez à mão (Actions > Run workflow) e depois
# apagar este arquivo. A migração das tabelas samu_* já foi aplicada pelo deploy.
#
# A planilha não está no git: vem do repositório público Ameciclo/atlas, fixada no commit que a adicionou, e é
# conferida pelo SHA-256 antes de qualquer gravação (o mesmo que carregou o staging).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_POSTGRES_SERVER: ameciclo-postgres-pub
      FIREWALL_RULE: github-run-${{ github.run_id }}
      SAMU_SOURCE: https://raw.githubusercontent.com/Ameciclo/atlas/b3717179df40aa08aae076ba4aa842d23c1a5ea9/apps/emergency-calls/src/db/sinistros-samu-tudo-final-ruas-corrigidas.tsv
      SAMU_SHA256: b1ab3e66e5a5e3a7043fd6d6d008e0544bfc7c6ec3088696cbe8ae627f9c653e
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - name: Baixar a planilha e conferir
        run: |
          mkdir -p data/samu
          curl -fsSL "$SAMU_SOURCE" -o data/samu/sinistros-samu.tsv
          echo "$SAMU_SHA256  data/samu/sinistros-samu.tsv" | sha256sum -c -

      - name: Conferir a leitura sem gravar
        run: pnpm --filter @ameciclo/db db:import-samu -- --dry-run
        env:
          DATABASE_URL: postgres://sem-banco:sem-banco@localhost:5432/sem-banco

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az postgres flexible-server firewall-rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER"; }
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale" --yes
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip"
          host="$AZ_POSTGRES_SERVER.postgres.database.azure.com"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/5432" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port 5432 is still closed 90 s after the firewall rule was created"
          exit 1

      - name: Importar
        run: pnpm --filter @ameciclo/db db:import-samu
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete --subscription "$AZ_SUBSCRIPTION" \
            -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER" -n "$FIREWALL_RULE" --yes
