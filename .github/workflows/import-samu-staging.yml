name: Importar chamados do SAMU no staging (one-off)

# Throwaway: applies the samu_* migration and loads the SAMU calls into the staging
# database (packages/db/scripts/import-samu.ts). The table is a snapshot of the file, so
# running it again replaces the calls. Runs when this file is pushed to the PR branch, or
# by hand. Afterwards delete this file.
#
# The spreadsheet is not in git: it comes from the public Ameciclo/atlas repo, pinned to
# the commit that added it, and is checked against its SHA-256 before anything is written.
on:
  workflow_dispatch:
  push:
    branches: [feat/samu-no-banco]
    paths: [.github/workflows/import-samu-staging.yml]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    name: Import into the staging database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_NSG: ameciclo-k3s-nsg
      DB_HOST: db-staging.az.ameciclo.org
      DB_PORT: "15432"
      NSG_RULE: github-run-${{ github.run_id }}
      SAMU_SOURCE: https://raw.githubusercontent.com/Ameciclo/atlas/b3717179df40aa08aae076ba4aa842d23c1a5ea9/apps/emergency-calls/src/db/sinistros-samu-tudo-final-ruas-corrigidas.tsv
      SAMU_SHA256: b1ab3e66e5a5e3a7043fd6d6d008e0544bfc7c6ec3088696cbe8ae627f9c653e
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - name: Download the spreadsheet and check it
        run: |
          mkdir -p data/samu
          curl -fsSL "$SAMU_SOURCE" -o data/samu/sinistros-samu.tsv
          echo "$SAMU_SHA256  data/samu/sinistros-samu.tsv" | sha256sum -c -

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az network nsg rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" --nsg-name "$AZ_NSG"; }
          # A cancelled run may have left its rule behind.
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale"
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$NSG_RULE" --priority 1100 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$ip/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges "$DB_PORT"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port $DB_PORT is still closed 90 s after the rule was created"
          exit 1

      - name: Apply the migration and import
        run: |
          export DATABASE_URL="${STAGING_DATABASE_URL}?sslmode=verify-ca&uselibpqcompat=true&sslrootcert=$GITHUB_WORKSPACE/.github/staging-db-ca.crt"
          pnpm --filter @ameciclo/db db:migrate
          pnpm --filter @ameciclo/db db:import-samu
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az network nsg rule delete --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" \
            --nsg-name "$AZ_NSG" -n "$NSG_RULE"
