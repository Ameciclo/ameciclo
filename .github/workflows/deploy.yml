name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # Postgres has no public address, so this runs on a runner inside the Azure
  # VNet (see .github/runner/README.md). Migrations run before the Workers are
  # deployed: a failed migration stops the deploy, and the old Workers keep
  # serving against the new schema, so migrations must stay backwards compatible.
  # db:import is a one-off and deliberately never runs here.
  migrate:
    name: Migrate database
    runs-on: [self-hosted, ameciclo-vnet]
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - name: Apply migrations
        run: pnpm --filter @ameciclo/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Idempotent: only inserts what is missing, never overwrites dictionary
      # edits made in the admin.
      - name: Seed the characteristics dictionary
        run: pnpm --filter @ameciclo/db db:seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    environment:
      name: production
      url: ${{ matrix.app == 'web' && 'https://ameciclo.org' || 'https://admin.ameciclo.org' }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @ameciclo/${{ matrix.app }} build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
