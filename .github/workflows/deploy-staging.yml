name: Deploy to Staging

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  # Runs before the Workers are deployed. The staging Postgres (Coolify) only
  # accepts Cloudflare on port 15432, so like production's migrate job this one
  # logs in to Azure with OIDC, opens a rule for this runner's IP on the VM's
  # network security group, and always closes it. Setup: .github/azure-oidc.md
  migrate:
    name: Migrate staging database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_NSG: ameciclo-k3s-nsg
      DB_HOST: db-staging.az.ameciclo.org
      DB_PORT: "15432"
      NSG_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az network nsg rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" --nsg-name "$AZ_NSG"; }
          # A cancelled run may have left its rule behind.
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale"
          done
          ip=$(curl -fsS https://api.ipify.org)
          # Runs are serialized by the concurrency group, so one priority is enough.
          rules create -n "$NSG_RULE" --priority 1100 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$ip/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges "$DB_PORT"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port $DB_PORT is still closed 90 s after the rule was created"
          exit 1

      # verify-ca checks the chain against Coolify's CA. The server certificate is
      # issued to the container name, so the host name is not checked.
      - name: Apply migrations and seed the dictionary
        run: |
          export DATABASE_URL="${STAGING_DATABASE_URL}?sslmode=verify-ca&uselibpqcompat=true&sslrootcert=$GITHUB_WORKSPACE/.github/staging-db-ca.crt"
          pnpm --filter @ameciclo/db db:migrate
          pnpm --filter @ameciclo/db db:seed
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az network nsg rule delete --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" \
            --nsg-name "$AZ_NSG" -n "$NSG_RULE"

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    environment:
      name: staging
      url: ${{ matrix.app == 'web' && 'https://staging.ameciclo.org' || 'https://staging-admin.ameciclo.org' }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The Cloudflare Vite plugin resolves the Wrangler environment HERE, at
      # build time, and flattens it into dist/server/wrangler.json. This env var
      # is the only thing that selects staging.
      - run: pnpm --filter @ameciclo/${{ matrix.app }} build
        env:
          CLOUDFLARE_ENV: staging

      # Deliberately no `--env staging`. Wrangler reads the already-flattened
      # config produced above (via .wrangler/deploy/config.json), which has no
      # `env` block left to select from — so `--env` is silently ignored and
      # would only create false confidence. See:
      # https://developers.cloudflare.com/workers/wrangler/environments/
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: apps/${{ matrix.app }}
          command: deploy
