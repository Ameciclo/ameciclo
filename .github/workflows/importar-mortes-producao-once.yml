name: Importar mortes no trânsito em produção (one-off)

# Descartável: baixa do FTP do DATASUS os óbitos do SIM (2011 em diante), filtra a RMR e importa em produção.
# Rodar uma vez à mão (Actions > Run workflow) e depois apagar este arquivo. A migração (pipeline_run) já
# é aplicada pelo deploy; aqui só entram os dados.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_POSTGRES_SERVER: ameciclo-postgres-pub
      FIREWALL_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - name: Baixar e filtrar os óbitos do SIM (DATASUS)
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/mortes"
          for ano in $(seq 2011 2026); do
            pnpm --filter @ameciclo/db db:datasus-baixar "$ano" "$RUNNER_TEMP/work" "$RUNNER_TEMP/mortes"
            pnpm --filter @ameciclo/db db:datasus-filtrar "$ano" "$RUNNER_TEMP/work" "$RUNNER_TEMP/mortes"
          done
          ls -la "$RUNNER_TEMP/mortes"

      - name: Conferir sem gravar
        run: pnpm --filter @ameciclo/db db:import-mortes -- --dry-run
        env:
          MORTES_DIR: ${{ runner.temp }}/mortes

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az postgres flexible-server firewall-rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER"; }
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale" --yes
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip"
          host="$AZ_POSTGRES_SERVER.postgres.database.azure.com"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/5432" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port 5432 is still closed 90 s after the firewall rule was created"
          exit 1

      - name: Importar
        run: pnpm --filter @ameciclo/db db:import-mortes
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MORTES_DIR: ${{ runner.temp }}/mortes

      - name: Close the firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete --subscription "$AZ_SUBSCRIPTION" \
            -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER" -n "$FIREWALL_RULE" --yes
