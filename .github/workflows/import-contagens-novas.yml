name: Importar contagens de abril/maio de 2026 (one-off)

# Throwaway: adds the 12 counts of 2026-04/05 that are in the team's spreadsheet but not
# in production (packages/db/scripts/import-contagens-novas.ts). Adds only; never deletes.
# Run it once with dry_run on (the default: everything is rolled back and the log shows
# what would be created), then again with dry_run off. New counts enter as drafts and are
# published from the admin after review. Afterwards delete this file and data/contagens-2026-04/.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show what would be created (rolls everything back)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_POSTGRES_SERVER: ameciclo-postgres-pub
      FIREWALL_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az postgres flexible-server firewall-rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER"; }
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale" --yes
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip"
          host="$AZ_POSTGRES_SERVER.postgres.database.azure.com"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/5432" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port 5432 is still closed 90 s after the firewall rule was created"
          exit 1

      - name: Import
        run: pnpm --filter @ameciclo/db db:import-novas ../../data/contagens-2026-04 ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete --subscription "$AZ_SUBSCRIPTION" \
            -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER" -n "$FIREWALL_RULE" --yes
