name: Importar mortes no trânsito no staging (one-off)

# Descartável: baixa do FTP do DATASUS os óbitos do SIM (2011 em diante), converte (packages/db/scripts/
# baixar-mortes.py) e importa no staging, para o preview do PR da página de sinistros fatais. Roda no push
# deste arquivo no PR e é removido em seguida.
on:
  pull_request:
    paths:
      - .github/workflows/importar-mortes-staging.yml

permissions:
  contents: read

concurrency:
  group: importar-mortes-staging

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_NSG: ameciclo-k3s-nsg
      DB_HOST: db-staging.az.ameciclo.org
      DB_PORT: "15432"
      NSG_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - name: Baixar e converter os óbitos do SIM (DATASUS)
        run: |
          pip install --quiet datasus-dbc dbfread
          mkdir -p "$RUNNER_TEMP/mortes"
          seq 2011 2026 | xargs -P4 -I{} python packages/db/scripts/baixar-mortes.py {} "$RUNNER_TEMP/mortes"
          ls -la "$RUNNER_TEMP/mortes"

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az network nsg rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" --nsg-name "$AZ_NSG"; }
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale"
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$NSG_RULE" --priority 1100 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$ip/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges "$DB_PORT"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port $DB_PORT is still closed 90 s after the rule was created"
          exit 1

      - name: Aplicar a migração e importar
        run: |
          export DATABASE_URL="${STAGING_DATABASE_URL}?sslmode=verify-ca&uselibpqcompat=true&sslrootcert=$GITHUB_WORKSPACE/.github/staging-db-ca.crt"
          export MORTES_DIR="$RUNNER_TEMP/mortes"
          pnpm --filter @ameciclo/db db:migrate
          pnpm --filter @ameciclo/db db:import-mortes
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az network nsg rule delete --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" \
            --nsg-name "$AZ_NSG" -n "$NSG_RULE"
