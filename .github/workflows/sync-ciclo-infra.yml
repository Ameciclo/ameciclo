name: Sincronizar infraestrutura cicloviária com o OpenStreetMap

# Manual fallback for the weekly OpenStreetMap sync. The scheduled one is the
# Cloudflare Workflow in apps/sync, which fetches Overpass in small retried pieces
# and keeps every answer in R2. This one asks Overpass in two big queries from a
# GitHub runner (packages/db/scripts/sync-ciclo-infra.ts), which Overpass often
# refuses, so use it only when the Workflow cannot run.
#
# It can run against staging, or as a dry run that reports and writes nothing.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Database to sync
        type: choice
        options: [production, staging]
        default: production
      dry_run:
        description: Only report what would change
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  production:
    name: Sync the production database
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sync-ciclo-infra-production
      cancel-in-progress: false
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_POSTGRES_SERVER: ameciclo-postgres-pub
      FIREWALL_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az postgres flexible-server firewall-rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER"; }
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale" --yes
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$FIREWALL_RULE" --start-ip-address "$ip" --end-ip-address "$ip"
          host="$AZ_POSTGRES_SERVER.postgres.database.azure.com"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$host/5432" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port 5432 is still closed 90 s after the firewall rule was created"
          exit 1

      - name: Sync
        run: pnpm --filter @ameciclo/db db:sync-ciclo-infra ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete --subscription "$AZ_SUBSCRIPTION" \
            -g "$AZ_RESOURCE_GROUP" -s "$AZ_POSTGRES_SERVER" -n "$FIREWALL_RULE" --yes

  staging:
    name: Sync the staging database
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
    permissions:
      contents: read
      id-token: write
    env:
      AZ_SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZ_RESOURCE_GROUP: ameciclo-rg-prod
      AZ_NSG: ameciclo-k3s-nsg
      DB_HOST: db-staging.az.ameciclo.org
      DB_PORT: "15432"
      NSG_RULE: github-run-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          cache: true

      - run: pnpm install --frozen-lockfile --filter @ameciclo/db...

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Open the firewall for this runner
        run: |
          rules() { az network nsg rule "$@" --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" --nsg-name "$AZ_NSG"; }
          # A cancelled run may have left its rule behind.
          for stale in $(rules list --query "[?starts_with(name, 'github-run-')].name" -o tsv); do
            rules delete -n "$stale"
          done
          ip=$(curl -fsS https://api.ipify.org)
          rules create -n "$NSG_RULE" --priority 1100 --direction Inbound --access Allow --protocol Tcp \
            --source-address-prefixes "$ip/32" --source-port-ranges '*' \
            --destination-address-prefixes '*' --destination-port-ranges "$DB_PORT"
          for _ in $(seq 1 18); do
            timeout 5 bash -c "exec 3<>/dev/tcp/$DB_HOST/$DB_PORT" 2>/dev/null && exit 0
            sleep 5
          done
          echo "::error::Port $DB_PORT is still closed 90 s after the rule was created"
          exit 1

      - name: Sync
        run: |
          export DATABASE_URL="${STAGING_DATABASE_URL}?sslmode=verify-ca&uselibpqcompat=true&sslrootcert=$GITHUB_WORKSPACE/.github/staging-db-ca.crt"
          pnpm --filter @ameciclo/db db:sync-ciclo-infra ${{ inputs.dry_run && '-- --dry-run' || '' }}
        env:
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Close the firewall
        if: always()
        run: |
          az network nsg rule delete --subscription "$AZ_SUBSCRIPTION" -g "$AZ_RESOURCE_GROUP" \
            --nsg-name "$AZ_NSG" -n "$NSG_RULE"
