# GitHub Actions runner for jobs that need the Azure VNet (database migrations).
# Deploy it as a Docker Compose resource in Coolify, on the host that is in the
# same VNet as ameciclo-postgres. See README.md in this folder.
services:
  runner:
    image: myoung34/github-runner:2.338.1-ubuntu-noble
    restart: unless-stopped
    environment:
      REPO_URL: https://github.com/Ameciclo/ameciclo
      # Fine-grained PAT (or GitHub App token) used to register the runner; set
      # it in Coolify, never in this file.
      ACCESS_TOKEN: ${RUNNER_ACCESS_TOKEN}
      RUNNER_NAME: ameciclo-vnet-1
      RUNNER_WORKDIR: /tmp/runner-work
      LABELS: ameciclo-vnet
      # One job per container, then a clean one: nothing from a job survives it.
      EPHEMERAL: "true"
    # No docker socket and no volumes on purpose: the migrate job only needs
    # node, and a job must not be able to reach the host.
    mem_limit: 1g
    cpus: 1
