# Ambiente local do pipeline, para comparar os dois orquestradores com o mesmo código:
#   Postgres  localhost:5440
#   Dagu      http://localhost:8095  (sem login)
#   Kestra    http://localhost:8098  (admin@kestra.io / Admin1234!)
#
#   docker compose -f pipelines/docker-compose.yml up -d --build
#   python3 pipelines/kestra/sincronizar.py enviar     # manda o fluxo e o código para o Kestra
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: ameciclo-pipeline-db
    environment:
      POSTGRES_USER: ameciclo
      POSTGRES_PASSWORD: ameciclo
      POSTGRES_DB: ameciclo
    ports:
      - "5440:5432"
    volumes:
      - pipeline-db:/var/lib/postgresql/data
      - ./sql/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
      - ./sql/local.sql:/docker-entrypoint-initdb.d/20-local.sql:ro
      # Depois das migrações do Drizzle, como admin: psql ... < sql/permissoes.sql (ver README).
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ameciclo"]
      interval: 5s

  dagu:
    build: .
    container_name: ameciclo-pipeline-dagu
    depends_on:
      db:
        condition: service_healthy
    environment:
      # O usuário restrito do pipeline (sql/bootstrap.sql): não muda a estrutura das tabelas do Drizzle.
      PIPELINE_DATABASE_URL: postgresql://pipeline:pipeline@db:5432/ameciclo
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: ameciclo
      # Local, sem login. Em produção o Dagu fica com DAGU_AUTH_MODE=builtin.
      DAGU_AUTH_MODE: none
    ports:
      - "8095:8080"
    volumes:
      # O código fica montado para editar sem reconstruir a imagem; o ambiente Python está na imagem.
      - ./ingest:/opt/pipelines/ingest
      - ./transform:/opt/pipelines/transform
      - ./dags:/opt/dags
      - ./lake:/var/lib/pipelines/lake
      # Os CSVs do DATASUS já baixados, para testar sem o FTP.
      - ../data/mortes:/data/mortes:ro
      - dagu-data:/var/lib/dagu

  kestra:
    build:
      context: .
      dockerfile: Dockerfile.kestra
    container_name: ameciclo-pipeline-kestra
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Os passos herdam estas variáveis (task runner Process). Em produção viriam de secrets.
      # O usuário restrito do pipeline (sql/bootstrap.sql): não muda a estrutura das tabelas do Drizzle.
      PIPELINE_DATABASE_URL: postgresql://pipeline:pipeline@db:5432/ameciclo
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pipeline
      PGPASSWORD: pipeline
      PGDATABASE: ameciclo
      # A configuração está em kestra/application.yaml (a mesma do Coolify); aqui só os valores locais.
      KESTRA_DB_URL: jdbc:postgresql://db:5432/kestra
      KESTRA_DB_USER: ameciclo
      KESTRA_DB_PASSWORD: ameciclo
      KESTRA_ADMIN_USER: admin@kestra.io
      KESTRA_ADMIN_PASSWORD: Admin1234!
      KESTRA_URL: http://localhost:8098/
    ports:
      - "8098:8080"
    volumes:
      # O mesmo lago do Dagu (em produção os dois apontariam para o R2).
      - ./lake:/var/lib/pipelines/lake
      - ../data/mortes:/data/mortes:ro
      - kestra-storage:/app/storage

volumes:
  pipeline-db:
  dagu-data:
  kestra-storage:
