# Ambiente local do pipeline: Postgres (porta 5440) e Dagu (http://localhost:8095).
#   docker compose -f pipelines/docker-compose.yml up -d --build
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: ameciclo-pipeline-db
    environment:
      POSTGRES_USER: ameciclo
      POSTGRES_PASSWORD: ameciclo
      POSTGRES_DB: ameciclo
    ports:
      - "5440:5432"
    volumes:
      - pipeline-db:/var/lib/postgresql/data
      - ./sql/bootstrap.sql:/docker-entrypoint-initdb.d/10-bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ameciclo"]
      interval: 5s

  dagu:
    build: .
    container_name: ameciclo-pipeline-dagu
    depends_on:
      db:
        condition: service_healthy
    environment:
      PIPELINE_DATABASE_URL: postgresql://ameciclo:ameciclo@db:5432/ameciclo
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ameciclo
      PGPASSWORD: ameciclo
      PGDATABASE: ameciclo
      # Local, sem login. Em produção o Dagu fica com DAGU_AUTH_MODE=builtin.
      DAGU_AUTH_MODE: none
    ports:
      - "8095:8080"
    volumes:
      # O código fica montado para editar sem reconstruir a imagem; o ambiente Python está na imagem.
      - ./ingest:/opt/pipelines/ingest
      - ./transform:/opt/pipelines/transform
      - ./dags:/opt/dags
      - ./lake:/var/lib/pipelines/lake
      # Os CSVs do DATASUS já baixados, para testar sem o FTP.
      - ../data/mortes:/data/mortes:ro
      - dagu-data:/var/lib/dagu

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    container_name: ameciclo-pipeline-dagster
    depends_on:
      db:
        condition: service_healthy
    environment:
      PIPELINE_DATABASE_URL: postgresql://ameciclo:ameciclo@db:5432/ameciclo
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ameciclo
      PGPASSWORD: ameciclo
      PGDATABASE: ameciclo
    ports:
      - "8096:3000"
    volumes:
      - ./ingest:/opt/pipelines/ingest
      - ./transform:/opt/pipelines/transform
      - ./orquestracao:/opt/pipelines/orquestracao
      - ./lake:/var/lib/pipelines/lake
      - ../data/mortes:/data/mortes:ro

  windmill:
    image: ghcr.io/windmill-labs/windmill:1.876.1
    container_name: ameciclo-pipeline-windmill
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ameciclo:ameciclo@db/windmill?sslmode=disable
      MODE: server
      BASE_URL: http://localhost:8097
      SUPERADMIN_SECRET: local-superadmin
    ports:
      - "8097:8000"

  windmill-worker:
    # A imagem oficial: o Windmill instala sozinho as dependências de cada script (o cabeçalho #requirements).
    image: ghcr.io/windmill-labs/windmill:1.876.1
    container_name: ameciclo-pipeline-windmill-worker
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ameciclo:ameciclo@db/windmill?sslmode=disable
      MODE: worker
      WORKER_GROUP: default
    # O banco chega aos scripts pelo resource f/pipelines/banco_local, não por variável de ambiente.
    volumes:
      - ./transform:/opt/pipelines/transform:ro
      - windmill-cache:/tmp/windmill/cache
      - windmill-lake:/var/lib/pipelines/lake
      - ../data/mortes:/data/mortes:ro

volumes:
  pipeline-db:
  dagu-data:
  windmill-cache:
  windmill-lake:
