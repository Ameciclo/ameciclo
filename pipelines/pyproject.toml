[project]
name = "ameciclo-pipelines"
version = "0.1.0"
description = "Ingestão (Python) e transformação (dbt) dos dados do Observatório da Ameciclo"
requires-python = ">=3.12,<3.14"
dependencies = [
  "dbt-postgres>=1.9",
  "psycopg[binary]>=3.2",
  # Para baixar do FTP do DATASUS (o modo --de-pasta não precisa delas).
  "datasus-dbc>=0.1",
  "dbfread>=2.0",
]

[tool.uv]
package = false
