version: 2

models:
  - name: traffic_death
    description: >
      O que vai para public.traffic_death (tabela do Drizzle, em packages/db/src/deaths-schema.ts). Os tipos do contrato
      são os da tabela; o teste traffic_death_igual_ao_drizzle confere que continuam batendo com o banco.
    config:
      # O contrato: se o SQL mudar uma coluna ou um tipo, o dbt build falha antes da publicação.
      contract:
        enforced: true
    columns:
      - name: source_year
        data_type: smallint
        data_tests: [not_null]
      - name: source_row
        data_type: integer
        data_tests: [not_null]
      - name: year
        data_type: smallint
        data_tests: [not_null]
      - name: month
        data_type: smallint
        data_tests: [not_null]
      - name: occurrence_city
        data_type: integer
      - name: residence_city
        data_type: integer
      - name: death_place
        data_type: text
      - name: cause
        data_type: text
        data_tests: [not_null]
      - name: secondary_causes
        data_type: text
      - name: sex
        data_type: text
      - name: race_color
        data_type: text
      - name: age_years
        data_type: smallint

exposures:
  - name: pagina_sinistros_fatais
    type: application
    url: https://www.ameciclo.org/dados/sinistros-fatais
    description: Página do Observatório com os óbitos no trânsito da RMR (lê public.traffic_death).
    owner:
      name: Ameciclo
    depends_on:
      - ref('traffic_death')
