ameciclo:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5440') | int }}"
      user: "{{ env_var('PGUSER', 'ameciclo') }}"
      password: "{{ env_var('PGPASSWORD', 'ameciclo') }}"
      dbname: "{{ env_var('PGDATABASE', 'ameciclo') }}"
      schema: public
      threads: 4
