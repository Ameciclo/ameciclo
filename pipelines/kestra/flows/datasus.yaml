id: datasus
namespace: ameciclo.pipelines
description: |
  Óbitos no trânsito (SIM/DATASUS) de UM ano: lago -> raw -> staging -> publicacao -> public.traffic_death (tabela do
  Drizzle). Junta os dois fluxos: datasus-ingerir (FTP -> lago -> raw) e datasus-publicar (dbt + publicação).
  O código de cada passo está nesses dois fluxos. Para vários anos, use o datasus-historico.
labels:
  fonte: datasus

inputs:
  - id: ano
    type: INT
    defaults: 2024
    description: Ano do arquivo do SIM
  - id: pasta
    type: STRING
    required: false
    description: Pasta com mortes_transito_AAAA.csv já baixado (ex. /data/mortes); vazio = baixar do FTP do DATASUS
  - id: forcar
    type: BOOL
    defaults: false
    description: Baixar e carregar de novo mesmo sem mudança

tasks:
  - id: ingerir
    type: io.kestra.plugin.core.flow.Subflow
    namespace: ameciclo.pipelines
    flowId: datasus-ingerir
    wait: true
    transmitFailed: true
    inputs:
      ano: "{{ inputs.ano }}"
      pasta: "{{ inputs.pasta ?? '' }}"
      forcar: "{{ inputs.forcar }}"

  - id: publicar
    type: io.kestra.plugin.core.flow.Subflow
    namespace: ameciclo.pipelines
    flowId: datasus-publicar
    wait: true
    transmitFailed: true

# O que a execução devolve (aba Outputs e resposta da ferramenta MCP).
outputs:
  - id: arquivo
    type: STRING
    description: novo, igual (ao último do lago) ou sem_mudanca (o arquivo no FTP não mudou)
    value: "{{ outputs.ingerir.outputs.arquivo }}"
  - id: carga
    type: STRING
    description: carregado ou ja_carregado
    value: "{{ outputs.ingerir.outputs.carga }}"
  - id: linhas_raw
    type: INT
    value: "{{ outputs.ingerir.outputs.linhas_raw }}"
  - id: anos_publicados
    type: STRING
    description: anos trocados em public.traffic_death (vazio = nenhum)
    value: "{{ outputs.publicar.outputs.anos_publicados }}"
  - id: obitos_inseridos
    type: INT
    value: "{{ outputs.publicar.outputs.obitos_inseridos }}"

triggers:
  # Ferramenta no servidor MCP do Kestra (Administration → MCP Servers → default): um agente de IA pode rodar este
  # fluxo, com as mesmas entradas. Grava só no banco de staging.
  - id: mcp
    type: io.kestra.plugin.core.trigger.McpToolTrigger
    toolName: datasus_obitos_ano
    title: Óbitos no trânsito (SIM/DATASUS), um ano
    toolDescription: >-
      Atualiza os óbitos no trânsito da RMR de um ano no banco de staging: baixa o arquivo do SIM (ou usa uma pasta),
      guarda no lago, carrega no raw, roda o dbt com os testes e publica em public.traffic_death. Se o arquivo não mudou,
      nada é recarregado. Use para atualizar ou conferir um ano específico.
    annotations:
      readOnly: false
      destructive: true
      idempotent: true
      openWorld: true
