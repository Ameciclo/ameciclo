summary: Óbitos de trânsito do SIM/DATASUS (RMR)
description: Baixa o ano do FTP do DATASUS, filtra a RMR, aplica as regras de
  limpeza e carrega em traffic_death. Por padrão só mostra o que seria gravado
  (gravar=false).
value:
  modules:
    - id: a
      summary: Baixar e filtrar a RMR
      value:
        type: script
        input_transforms:
          ano:
            type: javascript
            expr: flow_input.ano
        path: f/mortes_sim/baixar_e_filtrar
    - id: b
      summary: Limpar e transformar
      value:
        type: script
        input_transforms:
          linhas:
            type: javascript
            expr: results.a.linhas
        path: f/mortes_sim/transformar
    - id: c
      summary: Carregar no banco
      value:
        type: script
        input_transforms:
          ano:
            type: javascript
            expr: flow_input.ano
          banco:
            type: javascript
            expr: flow_input.banco
          gravar:
            type: javascript
            expr: flow_input.gravar
          obitos:
            type: javascript
            expr: results.b.obitos
        path: f/mortes_sim/carregar
schema:
  $schema: https://json-schema.org/draft/2020-12/schema
  type: object
  properties:
    ano:
      type: integer
      description: Ano do óbito (o DATASUS publica um arquivo por ano)
      default: 2026
    banco:
      type: object
      description: Recurso do Postgres de destino (só com gravar ligado)
      format: resource-postgresql
    gravar:
      type: boolean
      description: Grava em traffic_death (substitui o ano inteiro). Desligado, só
        mostra o que seria gravado.
      default: false
  required:
    - ano
