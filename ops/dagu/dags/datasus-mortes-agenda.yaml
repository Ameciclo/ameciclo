# Todo mês, atualiza o ano atual e o anterior (os anos recentes do SIM são preliminares e mudam).
# Atualiza a produção. Chama o fluxo datasus-mortes; ele só baixa de novo e importa se o DATASUS tiver mudado o arquivo.
description: "Atualização mensal das mortes no trânsito (SIM/DATASUS): ano atual e anterior"
labels:
  - fonte=datasus
schedule: "0 6 5 * *"
env:
  - ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
  - ANO_ATUAL: "`date +%Y`"
  - ANO_ANTERIOR: "`date -d '1 year ago' +%Y`"
handler_on:
  failure:
    run: sh /opt/scripts/avisar.sh "datasus-mortes-agenda falhou"
steps:
  - name: ano-anterior
    action: dag.run
    with:
      dag: datasus-mortes
      params:
        ALVO: producao
        YEAR: ${ANO_ANTERIOR}
        DRY_RUN: "false"
  - name: ano-atual
    depends:
      - ano-anterior
    action: dag.run
    with:
      dag: datasus-mortes
      params:
        ALVO: producao
        YEAR: ${ANO_ATUAL}
        DRY_RUN: "false"
