# Bicicletários e estações de Bike PE da RMR a partir do OpenStreetMap (alimentam o mapa de /dados/ciclodados).
# Código: packages/db/scripts/import-osm-lugares.ts, compilado para /opt/scripts/import-osm-lugares.mjs.
# Pergunta ao Overpass (espelho e servidor principal), recusa resultado pequeno demais (sinal de consulta falha) e
# substitui as duas tabelas numa transação.
#
# Parâmetros: ALVO (staging ou producao), DRY_RUN (true só busca e relata; false substitui bicycle_rack e bike_share_station).
description: Importa bicicletários e estações de Bike PE do OpenStreetMap para o banco
labels:
  - fonte=osm
params:
  - ALVO: "staging"
  - DRY_RUN: "true"
env:
  - DATABASE_URL_STAGING: ${DATABASE_URL_STAGING}
  - DATABASE_URL_PRODUCAO: ${DATABASE_URL_PRODUCAO}
  - OVERPASS_CONTACT: ${OVERPASS_CONTACT}
steps:
  - name: importar
    # Uma busca só (o Overpass recusa muita tentativa): com DRY_RUN=true o script só busca e relata; com false, grava.
    run: sh /opt/scripts/com-banco.sh node /opt/scripts/import-osm-lugares.mjs
    env:
      - DRY_RUN: ${DRY_RUN}
