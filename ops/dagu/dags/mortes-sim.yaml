# Óbitos por acidente de transporte do SIM/DATASUS na RMR (alimenta /dados/sinistros-fatais).
# Cada passo aparece no grafo, com o log e as contagens que ele imprime.
# Por padrão só valida (DRY_RUN=true); para gravar no banco, rode com DRY_RUN=false e DATABASE_URL definido.
description: Baixa o ano do DATASUS, filtra a RMR e carrega em traffic_death
params:
  - YEAR: "2026"
  - DRY_RUN: "true"
env:
  - DATA_DIR: /tmp/mortes
working_dir: /app/packages/db
steps:
  - name: baixar
    # FTP do DATASUS: versão final do ano ou, se ainda não saiu, a preliminar.
    run: pnpm db:datasus-baixar ${YEAR} ${DATA_DIR}

  - name: descompactar-e-filtrar
    depends:
      - baixar
    # .dbc (PKWare implode) -> CSV só com as causas de trânsito (V e Y85), no Brasil inteiro.
    run: pnpm db:datasus-filtrar ${YEAR} ${DATA_DIR}

  - name: validar
    depends:
      - descompactar-e-filtrar
    # Fica a RMR (ocorrência ou residência) com causa V01-V89 ou V99; imprime o que foi descartado e por quê.
    run: pnpm db:import-mortes --dry-run
    env:
      - MORTES_DIR: ${DATA_DIR}

  - name: carregar-no-banco
    depends:
      - validar
    # Substitui o ano inteiro numa transação; só roda com DRY_RUN=false.
    run: pnpm db:import-mortes
    env:
      - MORTES_DIR: ${DATA_DIR}
    preconditions:
      - condition: "${DRY_RUN}"
        expected: "false"
