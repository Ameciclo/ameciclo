# Todo mês, atualiza o ano atual e o anterior (os anos recentes do SIM são preliminares e mudam).
# Chama o fluxo mortes-sim; ele só baixa de novo e importa se o DATASUS tiver mudado o arquivo.
description: "Atualização mensal das mortes no trânsito (SIM/DATASUS): ano atual e anterior"
schedule: "0 6 5 * *"
env:
  - ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
  - ANO_ATUAL: "`date +%Y`"
  - ANO_ANTERIOR: "`date -d '1 year ago' +%Y`"
handler_on:
  failure:
    run: sh /opt/scripts/avisar.sh "mortes-sim-mensal falhou"
steps:
  - name: ano-anterior
    action: dag.run
    with:
      dag: mortes-sim
      params:
        YEAR: ${ANO_ANTERIOR}
        DRY_RUN: "false"
  - name: ano-atual
    depends:
      - ano-anterior
    action: dag.run
    with:
      dag: mortes-sim
      params:
        YEAR: ${ANO_ATUAL}
        DRY_RUN: "false"
