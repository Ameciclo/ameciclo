# Toda segunda, 7h: atualiza a infraestrutura cicloviária da produção (fluxo osm-ciclovias).
description: "Atualização semanal da infraestrutura cicloviária (OSM) na produção"
labels:
  - fonte=osm
schedule: "0 7 * * 1"
steps:
  - name: osm-producao
    action: dag.run
    with:
      dag: osm-ciclovias
      params:
        ALVO: producao
        DRY_RUN: "false"
