# Toda segunda, 7h: atualiza a infraestrutura cicloviária da produção (fluxo osm-sync).
description: "Atualização semanal da infraestrutura cicloviária (OSM) na produção"
schedule: "0 7 * * 1"
env:
  - ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
handler_on:
  failure:
    run: sh /opt/scripts/avisar.sh "osm-sync-semanal falhou"
steps:
  - name: osm-producao
    action: dag.run
    with:
      dag: osm-sync
      params:
        ALVO: producao
        DRY_RUN: "false"
