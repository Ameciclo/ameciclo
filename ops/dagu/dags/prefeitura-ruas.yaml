# Malha viária do Recife (trechos de logradouros da Prefeitura): dá extensão e traçado às vias do ranking de vias
# inseguras (/dados/viasinseguras). O arquivo quase não muda: roda à mão, quando a Prefeitura publicar uma versão nova.
# Código: pipelines/ingest/ruas_pcr.py (o arquivo baixado fica no lago, em raw/prefeitura/ruas/).
#
# Parâmetros: ALVO (staging ou producao), DRY_RUN (true só lê e relata; false substitui a tabela street_segment),
# URL (o GeoJSON "Trechos de Logradouros"; por padrão a cópia que o Atlas guardava).
description: Importa os trechos de logradouros da Prefeitura do Recife (malha viária) para o banco
labels:
  - fonte=prefeitura
params:
  - ALVO: "staging"
  - DRY_RUN: "true"
  - URL: "https://raw.githubusercontent.com/Ameciclo/atlas/dev/packages/database/seed-data/pcr_streets/trechos-de-logradouros.geojson"
env:
  - DATABASE_URL_STAGING: ${DATABASE_URL_STAGING}
  - DATABASE_URL_PRODUCAO: ${DATABASE_URL_PRODUCAO}
  - ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
handler_on:
  failure:
    run: sh /opt/scripts/avisar.sh "prefeitura-ruas (${ALVO}) falhou"
steps:
  - name: validar
    # Baixa e confere o arquivo; imprime quantos trechos entram e por que algum seria descartado. Não grava.
    working_dir: /opt/pipelines
    run: /opt/venv/bin/python -m ingest.ruas_pcr --dry-run --url ${URL}

  - name: carregar-no-banco
    depends:
      - validar
    # Substitui a tabela inteira numa transação, no banco do ALVO; só roda com DRY_RUN=false.
    working_dir: /opt/pipelines
    run: sh /opt/scripts/com-banco.sh /opt/venv/bin/python -m ingest.ruas_pcr --url ${URL}
    preconditions:
      - condition: "${DRY_RUN}"
        expected: "false"
