# Carga completa, uma vez (ou para refazer tudo): roda o fluxo mortes-sim de 2011 a 2026, um ano de cada vez.
# Se um ano falha, os outros continuam; depois, Retry refaz só o que falhou.
# Os anos que o DATASUS não mudou desde a última importação no mesmo ALVO são pulados.
# Parâmetros: ALVO (staging ou producao) e DRY_RUN (true só valida; false grava).
description: "Carga histórica das mortes no trânsito (SIM/DATASUS), 2011 a 2026"
params:
  - ALVO: "staging"
  - DRY_RUN: "true"
env:
  - ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL}
handler_on:
  failure:
    run: sh /opt/scripts/avisar.sh "mortes-sim-historico (${ALVO}) falhou"
steps:
  - name: ano-2011
    action: dag.run
    # Um ano que falha não impede os seguintes; os que falharam ficam marcados no fim.
    continue_on:
      failure: true
    with:
      dag: mortes-sim
      params:
        ALVO: ${ALVO}
        YEAR: "2011"
        DRY_RUN: ${DRY_RUN}

  - name: ano-2012
    depends:
      - ano-2011
    action: dag.run
    # Um ano que falha não impede os seguintes; os que falharam ficam marcados no fim.
